name: deploy-gcp-hosting

on:
  pull_request:
    branches:
      - main
    paths:
      - "app.yaml"
      - "main.py"
      - "*.html"
      - "css/**"
      - "images/**"
      - "CNAME"
      - "scripts/ci/validate-static-site.sh"
      - ".github/workflows/deploy-gcp-hosting.yml"
  push:
    branches:
      - main
    paths:
      - "app.yaml"
      - "main.py"
      - "*.html"
      - "css/**"
      - "images/**"
      - "CNAME"
      - "scripts/ci/validate-static-site.sh"
      - ".github/workflows/deploy-gcp-hosting.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target. Use production for live cutover or rollback."
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      deploy_ref:
        description: "Git ref or commit SHA to deploy (blank = current trigger SHA)."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-site:
    name: static-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.sha }}
      - name: Validate static site structure
        run: bash scripts/ci/validate-static-site.sh

  deploy-staging:
    name: deploy-staging-preview
    needs: validate-site
    if: >
      needs.validate-site.result == 'success' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
      )
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.sha }}
      - name: Validate deployment variables
        run: |
          set -euo pipefail
          missing=0
          for key in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_WIF_SERVICE_ACCOUNT; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required repository/environment variable: $key" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Deploy non-promoted App Engine version
        id: preview
        run: |
          set -euo pipefail
          version="stg-${GITHUB_SHA::12}"
          gcloud app deploy app.yaml \
            --project "$GCP_PROJECT_ID" \
            --version "$version" \
            --no-promote \
            --quiet

          default_hostname="$(gcloud app describe --project "$GCP_PROJECT_ID" --format='value(defaultHostname)')"
          preview_url="https://${version}-dot-default-dot-${default_hostname}"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Staging preview URL: $preview_url"
      - name: Publish staging summary
        run: |
          {
            echo "### Staging deploy"
            echo "- Preview URL: ${{ steps.preview.outputs.preview_url }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Platform: App Engine (non-promoted version)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: deploy-production-live
    needs:
      - validate-site
      - deploy-staging
    if: >
      needs.validate-site.result == 'success' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production')
      ) &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_ref || github.sha }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
      - name: Validate deployment variables
        run: |
          set -euo pipefail
          missing=0
          for key in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_WIF_SERVICE_ACCOUNT; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required repository/environment variable: $key" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Deploy and promote live App Engine version
        run: |
          set -euo pipefail
          gcloud app deploy app.yaml --project "$GCP_PROJECT_ID" --quiet
      - name: Publish production summary
        run: |
          {
            echo "### Production deploy"
            echo "- Platform: App Engine"
            echo "- Project: $GCP_PROJECT_ID"
            echo "- Ref: $DEPLOY_REF"
            echo
            echo "### Rollback"
            echo "- Re-run this workflow with \`target_environment=production\` and \`deploy_ref=<previous-good-sha>\`."
            echo
            echo "### Security expectations"
            echo "- App Engine handlers enforce HTTPS and include response security headers from \`app.yaml\`."
            echo "- Redeploying the previous good commit restores prior content globally."
          } >> "$GITHUB_STEP_SUMMARY"
