# claude-code-review — Claude reviews every pull request and posts findings ON the PR (OA-9 D8, layer 2).
#
# WHY. Owner ruling 2026-09-26 (TRADING/coordination/OWNER-ACTION-REGISTER.md, row OA-9, applies
# estate-wide): the agent opens, CI-checks and merges its own PRs; the owner reviews merged PRs
# retroactively. This workflow is the owner's retro-review aid: an independent Claude review, as
# `claude[bot]`, on every PR, posted as inline comments (or one summary comment when it finds
# nothing). It can NEVER approve or merge: the Claude Code GitHub Action posts comments only, and
# its tools here are restricted to the inline-comment MCP tool. Merge authority stays with the
# orchestrator, after this repository's own required checks (`static-validation`) are green.
#
# PUBLIC REPO CAVEAT: this repository is PUBLIC and keeps its own branch protection
# (`static-validation` required, `enforce_admins` off) rather than the estate's standard shape --
# left as configured, not changed by this PR. Repository secrets, including
# `CLAUDE_CODE_OAUTH_TOKEN`, are withheld from workflow runs triggered by fork pull requests, so
# this review only runs on pull requests from branches of this repository itself, not from forks.
#
# AUTH: `CLAUDE_CODE_OAUTH_TOKEN` repository secret = a long-lived token minted from the owner's
# Claude subscription with `claude setup-token` (docs: code.claude.com/docs/en/github-actions,
# "Manual setup"). If an API key is used instead, replace the input with
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
#
# WHO TRIGGERS: only pull_request events raised by a human actor with write access (the action's own
# check). `claude[bot]`'s own pushes cannot re-trigger this (bot actors are rejected unless listed in
# allowed_bots; claude[bot] and dependabot[bot] are listed so their pushes/PRs get reviewed instead of
# failing the check). Drafts are skipped by the review skill itself.
#
# COST: one review per PR event on the owner's subscription plus hosted-runner minutes; capped by
# timeout-minutes and --max-turns.

name: claude-code-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: t0
        name: Record job start (the non-empty gate below counts only comments posted after this)
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bot actors the action may run for. Without this the action FAILS the job for any
          # non-human actor (claude-code-action src/github/validation/actor.ts), so a claude[bot]
          # fix push from claude.yml, or a dependabot PR, would turn this check red. Matching
          # ignores case and the [bot] suffix. Added 2026-09-26 when `review` became the required
          # status check on repositories with no other CI (OA-9). Not "*": on a public repo that
          # would let any external App invoke this action.
          allowed_bots: "claude,dependabot"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # CORRECTED 2026-09-26 after the first real run (PR #307, run 36258760420): with ONLY the
          # inline-comment tool allowed, the run ended in 5 turns with permission_denials_count=4 and
          # posted nothing. The docs' example relies on the skill's `allowed-tools` frontmatter
          # pre-approving its gh reads; in the Action's non-interactive SDK run that did not hold.
          # The allow-list below is exactly the skill's own frontmatter set (read-only gh views of
          # the PR, its diff and comments, plus `gh pr comment` for the no-findings summary) plus the
          # Agent tool the skill uses to fan out its review subagents, plus read-only file tools.
          # Still no `gh pr merge`, no `gh pr review`, no push, no kubectl, no arbitrary shell.
          # show_full_output is on so the retro reviewer can see what the reviewer actually did;
          # this is a public repository, so no secret values are at risk of leaking through it.
          show_full_output: true
          # Skill added 2026-09-26: the run log's permission_denials showed the
          # code-review skill itself DENIED on every run; --append-system-prompt added
          # the same day because a background subagent dies when the Action's turn ends
          # (smoke pass w16: success conclusion, nothing posted).
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Agent,Skill,Read,Grep,Glob"
            --max-turns 40
            --append-system-prompt "This run is a non-interactive GitHub Action: it ends the moment your turn ends, and any subagent still running at that moment is lost with its work. Launch every Agent with run_in_background set to false and wait for its result before continuing. Do not end your turn until every finding is posted as an inline comment on the pull request, or one summary comment says there are no findings."

      # Non-empty gate, added 2026-09-27 (OA-9). On 2026-09-26 this job reported success on
      # 8 of 10 estate repos while posting nothing (Skill denied, background subagents lost).
      # That cause is fixed; this step makes the SHAPE impossible: a review run that posts no
      # inline comment and no summary comment is a failure, not a pass. Two legitimate-silence
      # cases are skipped: draft PRs (the review skill skips drafts) and PRs that change this
      # workflow file (the action skips itself there by design, "workflow validation").
      - name: Fail when the review posted nothing
        if: ${{ !cancelled() && github.event.pull_request.draft == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.t0.outputs.since }}
        run: |
          set -u
          if gh pr diff "$PR" -R "$REPO" --name-only | grep -qx '.github/workflows/claude-code-review.yml'; then
            echo "This PR changes the review workflow itself; the action skips such PRs by design. Gate skipped."
            exit 0
          fi
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | length")
          summary=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq "[.[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\")] | length")
          echo "claude[bot] comments since $SINCE: inline=$inline summary=$summary"
          if [ "$((inline + summary))" -eq 0 ]; then
            echo "::error::claude-code-review posted nothing on PR #$PR — treated as a failed review, not a pass (OA-9, 2026-09-27)"
            exit 1
          fi
